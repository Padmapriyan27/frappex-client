name: Integration

# Runs the integration suite against a real, throwaway Frappe site for each
# supported Frappe version.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "53 2 * * 4" # weekly: catches changes on the Frappe release branches
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frappe:
    name: frappe ${{ matrix.frappe }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - frappe: version-15
            python: "3.12"
          - frappe: version-16
            python: "3.14"
    services:
      mariadb:
        image: mariadb:10.6@sha256:75079c0fb96894284d00d035bc4bef94234814f6f6c28b79877bc69d3285d760
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -uroot -proot"
          --health-interval=5s --health-timeout=3s --health-retries=20
      redis:
        image: redis:7-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      # Frappe renders print formats with wkhtmltopdf. This is the
      # patched-Qt build Frappe recommends; Ubuntu's own package needs an X
      # display. The checksum pins the exact file.
      - name: Install wkhtmltopdf
        env:
          WKHTMLTOX_URL: https://github.com/wkhtmltopdf/packaging/releases/download/0.12.6.1-3/wkhtmltox_0.12.6.1-3.jammy_amd64.deb
          WKHTMLTOX_SHA256: 4f723b2691ad8638a9df960e0421d346d7315083e3583a334f33362280ddba15
        run: |
          curl --silent --show-error --fail --location --retry 3 --output "$RUNNER_TEMP/wkhtmltox.deb" "$WKHTMLTOX_URL"
          echo "$WKHTMLTOX_SHA256  $RUNNER_TEMP/wkhtmltox.deb" | sha256sum --check --strict
          sudo apt-get update --quiet
          sudo apt-get install --yes --quiet --no-install-recommends "$RUNNER_TEMP/wkhtmltox.deb"
          wkhtmltopdf --version
      - name: Start a Frappe site
        env:
          FRAPPE_BRANCH: ${{ matrix.frappe }}
        run: scripts/ci/start_frappe_site.sh "$FRAPPE_BRANCH" "$RUNNER_TEMP/bench"
      - name: Run the integration tests
        run: uv run --locked pytest tests/integration -v
      - name: Show the Frappe server log
        if: failure()
        run: tail -n 200 "$RUNNER_TEMP/bench/logs/serve.log" || true

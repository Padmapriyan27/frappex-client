# Lint, type-check and unit tests on every push and merge request.
# Integration tests need a live Frappe site and are run by hand; see
# docs/DEVELOPMENT.md.

stages:
  - test

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

variables:
  UV_CACHE_DIR: .uv-cache
  UV_LINK_MODE: copy

checks:
  stage: test
  image: ghcr.io/astral-sh/uv:python${PYTHON_VERSION}-bookworm-slim
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.10", "3.11", "3.12", "3.13", "3.14"]
  cache:
    key: uv-$PYTHON_VERSION
    paths:
      - .uv-cache
  script:
    - uv sync --locked
    - uv run ruff check .
    - uv run ruff format --check .
    - uv run mypy
    - uv run pytest --junitxml=report.xml
    - uv run pip-audit
    - uv build
  artifacts:
    when: always
    reports:
      junit: report.xml

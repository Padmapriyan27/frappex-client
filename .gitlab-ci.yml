# Lint, type-check and unit tests on every push and merge request.
# Integration tests need a live Frappe site and are run by hand; see
# docs/DEVELOPMENT.md.

stages:
  - test

# Static analysis (Semgrep) and secret detection. Findings are attached to
# the pipeline as report artifacts.
include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

variables:
  UV_CACHE_DIR: .uv-cache
  UV_LINK_MODE: copy

checks:
  stage: test
  image: ghcr.io/astral-sh/uv:python${PYTHON_VERSION}-bookworm-slim
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.10", "3.11", "3.12", "3.13", "3.14"]
  cache:
    key: uv-$PYTHON_VERSION
    paths:
      - .uv-cache
  script:
    - uv sync --locked
    - uv run ruff check .
    - uv run ruff format --check .
    - uv run mypy
    - uv run pytest --cov --cov-report=term --junitxml=report.xml
    - uv build
  coverage: '/^TOTAL.+?(\d+(?:\.\d+)?%)$/'
  artifacts:
    when: always
    reports:
      junit: report.xml

lowest-dependencies:
  stage: test
  image: ghcr.io/astral-sh/uv:python3.10-bookworm-slim
  script:
    - uv run --isolated --resolution lowest-direct pytest tests/unit

# Audits the locked dependencies for known vulnerabilities. pip-audit runs as
# a standalone tool so that its own dependencies stay out of the test
# environment.
audit:
  stage: test
  image: ghcr.io/astral-sh/uv:python3.13-bookworm-slim
  script:
    - uv export --locked --no-emit-project --output-file requirements-audit.txt
    - uvx pip-audit --requirement requirements-audit.txt --disable-pip

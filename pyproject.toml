[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "frappex-client"
version = "0.1.1"
description = "Typed sync and async REST client for Frappe and ERPNext sites."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Padmapriyan N" }]
maintainers = [{ name = "Padmapriyan N" }]
keywords = ["frappe", "erpnext", "rest", "client", "async", "httpx"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.27,<1"]

[project.urls]
Homepage = "https://github.com/Padmapriyan27/frappex-client"
Documentation = "https://frappex-client.zeal.ninja"
Repository = "https://github.com/Padmapriyan27/frappex-client"
Issues = "https://github.com/Padmapriyan27/frappex-client/issues"
Changelog = "https://github.com/Padmapriyan27/frappex-client/blob/main/CHANGELOG.md"
Security = "https://github.com/Padmapriyan27/frappex-client/security/policy"

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "mypy>=1.11",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/frappex_client"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs a live Frappe site (see docs/DEVELOPMENT.md)",
]

[tool.coverage.run]
source = ["frappex_client"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_also = ["if TYPE_CHECKING:"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src", "tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",  # pycodestyle, pyflakes
    "I",            # isort
    "B",            # bugbear
    "UP",           # pyupgrade
    "S",            # bandit security rules
    "SIM",          # simplify
    "D",            # pydocstyle (PEP 257)
    "RUF",
    "PT",           # pytest style
    "BLE",          # no blind except
    "T20",          # no print
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "D"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/docs", "/README.md", "/LICENSE", "/CHANGELOG.md", "/SECURITY.md"]
